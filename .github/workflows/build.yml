name: Build PSP EBOOT
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: mkdir -p out/PSP/GAME/Bloxorz && cp EBOOT.PBP out/PSP/GAME/Bloxorz/
      - uses: actions/upload-artifact@v4
        with:
          name: Bloxorz-PSP
          path: out
